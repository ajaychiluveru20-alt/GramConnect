databases:
  - name: gramconnect-db
    databaseName: gramconnect_db
    user: gramconnect_user
    plan: free
    region: oregon

services:
  # ----------------------------------------------------
  # Spring Boot Backend (Docker Web Service)
  # ----------------------------------------------------
  - type: web
    name: gramconnect-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: gramconnect-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"

  # ----------------------------------------------------
  # React + Vite Frontend (Static Site)
  # ----------------------------------------------------
  - type: web
    name: gramconnect-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://gramconnect-backend-ivyu.onrender.com/api
